# Netlify build settings for the Next.js web app inside the pnpm monorepo.
# Local dev is unaffected; this file only matters when you connect the repo to Netlify.
#
# base is deliberately EMPTY so pnpm installs the whole workspace from the repo root
# (where pnpm-lock.yaml lives). Every path below is relative to that root.
#
# The buildbot's "package directory" (set in the Netlify UI, NOT in this file) must be
# `apps/web`. Netlify auto-detect otherwise picks apps/mobile (Expo) as the site, which
# makes it resolve these paths relative to apps/mobile and run the Next.js runtime
# against an Expo project.

[build]
  base = ""
  # db:push is idempotent — it syncs the hosted Postgres schema before the app builds.
  command = "pnpm run db:push && pnpm --filter @learnovize/web build"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Prisma's postinstall tries to `pnpm add prisma` when it cannot find the CLI. On Netlify
  # that auto-install fails (frozen lockfile), which broke the build. Our build command runs
  # `prisma generate` explicitly, so the auto-install is unnecessary — skip it.
  PRISMA_GENERATE_SKIP_AUTOINSTALL = "true"
  # DATABASE_URL is intentionally NOT set here. Prisma's schema reads env("DATABASE_URL"),
  # so it must exist at build time — set it in the Netlify UI (Site configuration ->
  # Environment). Putting a placeholder here shadowed the real value.