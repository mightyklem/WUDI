services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnovize
      POSTGRES_PASSWORD: learnovize
      POSTGRES_DB: learnovize
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnovize"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # S3-compatible storage for local dev (adobe/s3mock).
  # Cloud target remains R2/S3 per ADR-004; app must use path-style S3 locally.
  # NOTE: s3mock does not auto-create buckets — create once per fresh volume:
  #   aws --endpoint-url http://localhost:9090 s3 mb s3://learnovize-public
  #   aws --endpoint-url http://localhost:9090 s3 mb s3://learnovize-private
  # (any S3 client with test/test credentials works).
  s3mock:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
      - "9191:9191"
    volumes:
      - s3mockdata:/s3mockroot

  # Live media (Phase 3): self-hosted LiveKit SFU in dev mode.
  # --dev enables built-in TURN; recording/egress are NOT configured (replays forbidden, FR-6.7).
  # Cloud: dedicated LiveKit + coturn with TLS on 443 (see ADR-005).
  livekit:
    image: livekit/livekit-server:v1.8
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
  redisdata:
  s3mockdata:
