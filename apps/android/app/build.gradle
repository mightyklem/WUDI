plugins {
    id("com.android.application")
}

def envStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def envStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def envKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace = "ng.learnovize.app"
    compileSdk = 34

    defaultConfig {
        // Must match the Expo app's package and the assetlinks statement.
        applicationId = "ng.learnovize.app"
        minSdk = 24
        targetSdk = 34
        // Monotonic per CI run so Play accepts every upload. Overridable locally.
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = "1.0.0"
    }

    // The signing block is only defined when a keystore is actually provided.
    // Defining it with a missing store file would break even unsigned builds,
    // and this module must always stay buildable without secrets. The locals are
    // deliberately prefixed: inside this closure a bare `storePassword` would
    // resolve to the SigningConfig's own (still null) property instead of the
    // script variable, and the build would fail at packaging time complaining the
    // property is missing -- exactly what run #5 did.
    if (envStoreFile) {
        signingConfigs {
            release {
                storeFile = file(envStoreFile)
                storePassword = envStorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            if (envStoreFile) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity launcher. No app code of our own is needed: the manifest
    // points straight at the library's LauncherActivity.
    implementation("com.google.androidbrowserhelper:androidbrowserhelper:2.5.0")
}
