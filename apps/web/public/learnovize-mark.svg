<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Learnovize">
  <!-- The mark as supplied: a square plate, not a rounded tile.
       The rounded version was reused on the strength of "same artwork, lighter file", which
       was me answering a question nobody had asked. The corners are part of the brand. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1B7E8D"/>
      <stop offset="55%" stop-color="#14616E"/>
      <stop offset="100%" stop-color="#0A343C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <path d="M 165 174 L 323 262 L 165 350 Z" fill="#FFFFFF"/>
  <!-- Broadcast waves. Drawn as stroked arcs rather than the soft lighten-blended
       ellipses in the supplied file: those read as lens flare at full size and as
       nothing at 26px, whereas a stroke stays a wave at every size it is rendered. -->
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M 300 168 A 46 46 0 0 1 300 356" opacity="0.45"/>
    <path d="M 352 138 A 92 92 0 0 1 352 386" opacity="0.22"/>
  </g>
</svg>
