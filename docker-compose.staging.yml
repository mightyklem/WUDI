# One-node staging stack. Local dev should still use docker-compose.yml.
# Starts Postgres, Redis, S3Mock and LiveKit with the staging config.
# Mount cert + turn key from outside the repo; never commit real private keys.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnovize
      POSTGRES_PASSWORD: learnovize
      POSTGRES_DB: learnovize
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnovize"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata-staging:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata-staging:/data

  s3mock:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
      - "9191:9191"
    volumes:
      - s3mockdata-staging:/s3mockroot

  livekit:
    image: livekit/livekit-server:v1.8
    command: --config /config/livekit-staging.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      # TLS for TURN should come from mounted certs, not the container layer.
      # TURN_CERT_FILE: /etc/letsencrypt/turn/fullchain.pem
      # TURN_KEY_FILE: /etc/letsencrypt/turn/privkey.pem
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit/livekit-staging.yaml:/config/livekit-staging.yaml:ro
      # - /etc/letsencrypt/livekit:/etc/letsencrypt/livekit:ro
      # - /etc/letsencrypt/turn:/etc/letsencrypt/turn:ro

volumes:
  pgdata-staging:
  redisdata-staging:
  s3mockdata-staging:
